name: Publicar AgendaFlow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site
        run: mkdir public && cp privacy.html public/

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
